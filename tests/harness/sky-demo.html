<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Demo bintang Universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/my-chrome-universe/ui/tokens.css">
<link rel="stylesheet" href="/my-chrome-universe/ui/components.css">
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx { z-index: 2; }
  h1 { position: fixed; inset: 0; display: grid; place-content: center; margin: 0; font: 700 96px var(--f-display); visibility: hidden; }
</style>
</head>
<body>
<canvas id="sky"></canvas><canvas id="fx"></canvas>
<h1 id="t"><span>Halo</span> <span>Semesta</span></h1>
<button class="btn rp glow" id="b" style="position:fixed;left:20px;top:20px;z-index:3">Tes</button>
<script src="/my-chrome-universe/ui/boot.js"></script>
<script type="module">
import { createSky } from '/my-chrome-universe/ui/sky.js';
import { toast, installEffects, countUp } from '/my-chrome-universe/ui/motion.js';
window.sky = createSky(document.getElementById('sky'), { mode: 'orbit', fxCanvas: document.getElementById('fx') });
installEffects();
window.toast = toast; window.countUp = countUp;
document.getElementById('b').onclick = (e) => { sky.burstAt(e.currentTarget); toast('Tersimpan', { action: { label: 'Urungkan', run() {} } }); };
</script>
</body>
</html>
