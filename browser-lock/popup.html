<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Browser Lock</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 260px; }
    .card { border: 0; border-radius: 0; padding: 16px; }
    h1 { font-size: 17px; }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Browser Lock</h1>
    <p class="sub" id="status"></p>
    <button type="button" id="lock" hidden>Kunci Sekarang</button>
    <button type="button" id="setup" hidden>Atur Password</button>
    <button type="button" class="secondary" id="options">Pengaturan</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
