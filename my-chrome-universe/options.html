<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengaturan - My Chrome Universe</title>
  <link rel="icon" href="icons/icon32.png">
  <script src="ui/boot.js"></script>
  <link rel="stylesheet" href="ui/tokens.css">
  <link rel="stylesheet" href="ui/components.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="nebula" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Hidden until the lock gate is open and every section has rendered. -->
  <div class="st" id="st">
    <nav class="st-nav" data-in style="--in:from-left" aria-label="Bagian pengaturan">
      <div class="st-brand"><svg class="logo" viewBox="0 0 40 40" data-logo></svg><b>Pengaturan<small>My Chrome Universe</small></b></div>
      <div class="st-links" id="st-links"><span class="st-ind" id="st-ind"></span></div>
      <button class="btn ghost sm rp st-back" type="button" id="st-back"><i data-ic="arrowLeft"></i>Kembali ke Tab Manager</button>
    </nav>
    <main class="st-main" id="st-main">
      <div class="st-top" id="st-top" data-in style="--in:from-top;--base:100ms">
        <div><h1>Pengaturan</h1><p>Semua modul diatur di satu tempat. Perubahan langsung tersimpan.</p></div>
        <div class="st-search"><i data-ic="search"></i><input class="input" id="st-q" type="search" placeholder="Cari pengaturan, mis. password, YouTube, animasi" aria-label="Cari pengaturan" autocomplete="off"></div>
        <span class="saved" id="saved" role="status"><i data-ic="check"></i><span id="saved-text">Tersimpan</span></span>
      </div>
      <div class="st-body" id="st-body"></div>
    </main>
  </div>

  <dialog class="dialog" id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <script type="module" src="options.js"></script>
</body>
</html>
